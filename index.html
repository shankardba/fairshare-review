<body>
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-brand"><img src="logo.svg" alt="" width="44" height="44"><span class="word">Fair<b>Share</b></span></div>
    <h1>Sign in</h1>
    <p class="sub">Partnership ownership &amp; distributions</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="login-err" id="loginErr" role="alert"></div>
    <button class="btn primary login-btn" type="submit" id="loginBtn">Sign in</button>
    <p class="login-foot">New to FairShare? <a href="/#get-started">Set up your partnership</a></p>
  </form>
</div>
<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <a class="brand" href="#/">
      <img src="logo.svg" alt="" width="34" height="34">
      <span class="word">Fair<b>Share</b></span>
    </a>

    <div class="side-label">Organization</div>
    <nav class="orgs" id="orgTree"></nav>
    <a class="new-org" id="newOrg" href="#/new-org" hidden>+ New organization</a>

    <div class="side-label">Reports</div>
    <nav class="nav" id="nav">
      <a data-view="overview"><svg viewBox="0 0 20 20"><path d="M3 10h5V3H3zm0 7h5v-5H3zm7 0h7v-7h-7zm0-14v5h7V3z"/></svg>Overview</a>
      <a data-view="events"><svg viewBox="0 0 20 20"><path d="M4 3h12v2H4zm0 4h12v2H4zm0 4h8v2H4zm0 4h8v2H4z"/></svg>Events</a>
      <a data-view="investors" data-admin><svg viewBox="0 0 20 20"><path d="M7 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm6 0a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM1 17c0-3 2.7-5 6-5s6 2 6 5zm13 0c0-1.6-.6-3-1.7-4 2.6-.3 5.7.9 5.7 4z"/></svg>Investors</a>
      <a class="soon"><svg viewBox="0 0 20 20"><path d="M10 2l2.4 5 5.6.6-4.2 3.8 1.2 5.6L10 14.2 5 17l1.2-5.6L2 7.6 7.6 7z"/></svg>Scenarios<em>soon</em></a>
      <a class="soon"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 4v4.4l3 1.8-1 1.6-4-2.4V6z"/></svg>Audit log<em>soon</em></a>
    </nav>

    <div class="who" id="who">
      <div class="who-name" id="whoName"></div>
      <div class="who-title" id="whoTitle"></div>
      <div id="viewAs" hidden>
        <div class="side-label">Preview as <span class="demo">demo</span></div>
        <select id="persona" aria-label="Preview the app as another role"></select>
      </div>
      <button class="signout" id="signOut" type="button">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M3 5h14v2H3zm0 4h14v2H3zm0 4h14v2H3z"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <span class="badge-secure" title="All calculations run server-side; this page receives results only."><svg viewBox="0 0 20 20"><path d="M10 1l7 3v5c0 4.4-3 8.4-7 10-4-1.6-7-5.6-7-10V4z"/></svg>Server-computed</span>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="tip" id="tip" role="tooltip"></div>
